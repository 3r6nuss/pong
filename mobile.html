<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong Mobile Controller</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #121214;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            touch-action: none;
            overflow: hidden;
        }
        #join-screen {
            text-align: center;
            width: 100%;
            max-width: 300px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }
        #control-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        /* percent overlay removed */
        #touch-area {
            width: 100%;
            height: 100%;
        }
        .motion-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 15px;
        }
        .motion-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        /* Simplified: hide graphical slider, keep percentage text */
        #motion-indicator {
            position: fixed;
            top: 10px;
            left: 10px;
            transform: none;
            display: none; /* shown when motion control active */
            align-items: center;
            gap: 6px;
            pointer-events: none;
            opacity: 1;
            z-index: 999;
        }
        #tilt-bar-wrap { display: none; }
        #tilt-bar { display: none; }
        #tilt-label {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: rgba(0,0,0,0.35);
            padding: 6px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="join-screen">
        <h2>Pong Steuerung</h2>
        <input type="text" id="name-input" placeholder="Dein Name" />
        <div class="motion-toggle">
            <input type="checkbox" id="motion-checkbox" />
            <label for="motion-checkbox">Motion Control (Neigung)</label>
        </div>
        <div class="btn-container">
            <button onclick="join('left')">Links</button>
            <button onclick="join('right')">Rechts</button>
        </div>
    </div>

    <div id="control-screen">
        <!-- percent overlay removed -->
        <div id="motion-indicator" style="display:none;">
            <div id="tilt-bar-wrap"><div id="tilt-bar"></div></div>
            <div id="tilt-label">50%</div>
        </div>
        <div id="touch-area"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = typeof io === "function" ? io() : null;
        const joinScreen = document.getElementById('join-screen');
        const controlScreen = document.getElementById('control-screen');
        const nameInput = document.getElementById('name-input');
        const touchArea = document.getElementById('touch-area');
        const motionCheckbox = document.getElementById('motion-checkbox');
        const motionIndicator = document.getElementById('motion-indicator');
        const tiltBar = document.getElementById('tilt-bar');
        const tiltLabel = document.getElementById('tilt-label');

        let motionEnabled = false;

        function join(side) {
            const name = nameInput.value.trim() || (side === 'left' ? 'Spieler Links' : 'Spieler Rechts');
            if (socket) {
                socket.emit('joinGame', { side, name });
            }
            joinScreen.style.display = 'none';
            controlScreen.style.display = 'block';

            if (motionCheckbox.checked) {
                startMotionControl();
            }
        }

        function sendTouch(y) {
            const relativeY = Math.max(0, Math.min(1, y));
            // percent overlay removed; just send value
            if (socket) {
                socket.emit('touchY', relativeY);
            }
        }

        // --- Motion Control ---

        function updateMotionUI(relativeY) {
            const p = Math.round(relativeY * 100);
            tiltLabel.textContent = p + '%';
            tiltBar.style.height = p + '%';
        }

        function onOrientation(e) {
            // gamma: left/right tilt, -90 to 90
            // Wir nutzen gamma: -45° = oben (0), +45° = unten (1)
            const gamma = e.gamma !== null ? e.gamma : 0;
            const clampedGamma = Math.max(-45, Math.min(45, gamma));
            const relativeY = (clampedGamma + 45) / 90;
            updateMotionUI(relativeY);
            if (socket) {
                socket.emit('touchY', relativeY);
            }
        }

        function startMotionControl() {
            motionEnabled = true;
            touchArea.style.pointerEvents = 'none';
            motionIndicator.style.display = 'flex';

            // iOS 13+ braucht explizite Erlaubnis
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            window.addEventListener('deviceorientation', onOrientation);
                        } else {
                            showMotionFallback();
                        }
                    })
                    .catch(() => showMotionFallback());
            } else {
                window.addEventListener('deviceorientation', onOrientation);
            }
        }

        function showMotionFallback() {
            motionEnabled = false;
            touchArea.style.pointerEvents = '';
            motionIndicator.style.display = 'none';
            alert('Motion Control konnte nicht aktiviert werden. Touch-Steuerung wird verwendet.');
        }

        touchArea.addEventListener('touchmove', (e) => {
            if (motionEnabled) return;
            e.preventDefault();
            const touch = e.touches[0];
            sendTouch(touch.clientY / window.innerHeight);
        }, { passive: false });

        touchArea.addEventListener('mousemove', (e) => {
            if (motionEnabled) return;
            if (e.buttons === 1) {
                sendTouch(e.clientY / window.innerHeight);
            }
        });
    </script>
</body>
</html>
